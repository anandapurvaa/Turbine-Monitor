permissions:
  contents: read
  id-token: write

name: Deploy Retraining Job to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'retrain/**'
      - 'src/**'
      - 'docker/Dockerfile.retrain'

env:
  PROJECT_ID: cloudprojects-506123
  REGION: europe-west3
  JOB_NAME: turbineguard-retrain
  IMAGE_NAME: retrain

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/20298064017/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider-v3
        service_account: github-actions@cloudprojects-506123.iam.gserviceaccount.com

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build and Push
      run: |
        docker build -f docker/Dockerfile.retrain \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/turbineguard/${{ env.IMAGE_NAME }}:latest \
          .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/turbineguard/${{ env.IMAGE_NAME }}:latest

    - name: Deploy Cloud Run Job
      run: |
        gcloud run jobs deploy ${{ env.JOB_NAME }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/turbineguard/${{ env.IMAGE_NAME }}:latest \
          --region ${{ env.REGION }} \
          --task-timeout 1h \
          --max-retries 1 \
          --set-env-vars GCS_BUCKET=turbineguard-data