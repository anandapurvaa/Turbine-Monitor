name: Deploy Dashboard to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: cloudprojects-506123
  REGION: europe-west3
  SERVICE_NAME: turbineguard-dash
  IMAGE_NAME: dash-dashboard

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ env.PROJECT_ID }}
    
    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev
    
    - name: Build and Push
      run: |
        docker build -f docker/Dockerfile.dash \
          -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/turbineguard/${{ env.IMAGE_NAME }}:latest .
        docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/turbineguard/${{ env.IMAGE_NAME }}:latest
    
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/turbineguard/${{ env.IMAGE_NAME }}:latest \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --port 8501 \
          --memory 2Gi \
          --cpu 1 \
          --timeout 300